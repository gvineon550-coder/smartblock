                                  Toast.makeText(context, "Импортировано из файла: $count", Toast.LENGTH_SHORT).show()
                              }
                          } catch (e: Exception) {
                              Toast.makeText(context, "Ошибка чтения файла", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }

                  fileBtn.setOnClickListener { filePicker.launch(arrayOf("text/plain", "*/*")) }
                  blockBtn.setOnClickListener {
                      val d = input.text.toString().trim().lowercase()
                      if (d.isNotEmpty()) { FilterEngine.addBlocked(d, requireContext()); input.text.clear(); refreshLists() }
                  }
                  whiteBtn.setOnClickListener {
                      val d = input.text.toString().trim().lowercase()
                      if (d.isNotEmpty()) { FilterEngine.addWhitelist(d, requireContext()); input.text.clear(); refreshLists() }
                  }
                  importBtn.setOnClickListener {
                      val text = bulkInput.text.toString()
                      val count = parseAndAdd(text)
                      bulkInput.text.clear()
                      refreshLists()
                      Toast.makeText(context, "Импортировано доменов: $count", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun renderList(container: LinearLayout, set: Set<String>, isWhite: Boolean, onRefresh: () -> Unit) {
                  container.removeAllViews()
                  if (set.isEmpty()) {
                      val tv = TextView(requireContext()).apply { text = "Пусто"; setTextColor(Color.GRAY); setPadding(0, 8, 0, 8) }
                      container.addView(tv)
                      return
                  }
                  set.sorted().forEach { domain ->
                      val row = LinearLayout(requireContext()).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL; setPadding(0, 8, 0, 8) }
                      val tv = TextView(requireContext()).apply { text = domain; setTextColor(Color.WHITE); layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f) }
                      val btn = Button(requireContext()).apply {
                          text = "✕"; setTextColor(Color.RED); setBackgroundColor(Color.TRANSPARENT); minWidth = 0; minimumWidth = 0
                          setOnClickListener {
                              val p = requireContext().getSharedPreferences("smartblock", Context.MODE_PRIVATE)
                              val key = if (isWhite) "user_white" else "user_block"
                              val cur = p.getStringSet(key, emptySet())?.toMutableSet() ?: mutableSetOf()
                              cur.remove(domain)
                              p.edit().putStringSet(key, cur).apply()
                              if (isWhite) FilterEngine.removeWhitelist(domain) else FilterEngine.removeBlocked(domain)
                              onRefresh()
                          }
                      }
                      row.addView(tv); row.addView(btn); container.addView(row)
                  }
              }
          }
