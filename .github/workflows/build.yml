          cat > app/src/main/java/com/gvineon550/smartblock/StatsView.kt << 'EOF'
          package com.gvineon550.smartblock

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RectF
          import android.util.AttributeSet
          import android.view.View

          class StatsView @JvmOverloads constructor(context: Context, attrs: AttributeSet? = null) : View(context, attrs) {
              var total = 0f
              var blocked = 0f
              private val pa = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#4CAF50"); style = Paint.Style.STROKE; strokeWidth = 20f }
              private val pb = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#F44336"); style = Paint.Style.STROKE; strokeWidth = 20f }
              private val rect = RectF()
              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val size = Math.min(width, height).toFloat() - 60f
                  val left = (width - size) / 2; val top = (height - size) / 2
                  rect.set(left, top, left + size, top + size)
                  if (total == 0f) { pa.color = Color.parseColor("#555555"); canvas.drawArc(rect, 0f, 360f, false, pa); return }
                  val sweep = (blocked / total) * 360f
                  pa.color = Color.parseColor("#4CAF50")
                  canvas.drawArc(rect, 0f, 360f - sweep, false, pa)
                  canvas.drawArc(rect, 0f, sweep, false, pb)
              }
          }
          EOF

          cat > app/src/main/java/com/gvineon550/smartblock/MainActivity.kt << 'EOF'
          package com.gvineon550.smartblock

          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import androidx.fragment.app.Fragment
          import com.google.android.material.bottomnavigation.BottomNavigationView

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  val nav = findViewById<BottomNavigationView>(R.id.bottom_nav)
                  nav.setOnItemSelectedListener { item ->
                      var fragment: Fragment? = null
                      when (item.itemId) {
                          R.id.nav_home -> fragment = HomeFragment()
                          R.id.nav_logs -> fragment = LogsFragment()
                          R.id.nav_lists -> fragment = ListsFragment()
                          R.id.nav_settings -> fragment = SettingsFragment()
                      }
                      if (fragment != null) { supportFragmentManager.beginTransaction().replace(R.id.fragment_container, fragment).commit(); true } else false
                  }
                  if (savedInstanceState == null) nav.selectedItemId = R.id.nav_home
              }
          }
          EOF

          cat > app/src/main/java/com/gvineon550/smartblock/HomeFragment.kt << 'EOF'
          package com.gvineon550.smartblock

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.VpnService
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.widget.SwitchCompat
          import androidx.core.content.ContextCompat
          import androidx.fragment.app.Fragment
          import kotlin.concurrent.thread

          class HomeFragment : Fragment() {
              private val reqVpn = 100
              override fun onCreateView(inflater: LayoutInflater, container: ViewGroup?, savedInstanceState: Bundle?): View {
                  return inflater.inflate(R.layout.fragment_home, container, false)
              }
              override fun onViewCreated(view: View, savedInstanceState: Bundle?) {
                  val reqNotif = registerForActivityResult(ActivityResultContracts.RequestPermission()) {}
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU && ContextCompat.checkSelfPermission(requireContext(), Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      reqNotif.launch(Manifest.permission.POST_NOTIFICATIONS)
                  }

                  val sw = view.findViewById<SwitchCompat>(R.id.vpnSwitch)
                  val status = view.findViewById<TextView>(R.id.statusText)
                  val stats = view.findViewById<StatsView>(R.id.statsView)
                  val statsText = view.findViewById<TextView>(R.id.statsText)
                  sw.isChecked = DnsVpnService.isRunning
                  status.text = if (DnsVpnService.isRunning) "🟢 Защита включена" else "⚪ Защита выключена"

                  sw.setOnCheckedChangeListener { _, on ->
                      if (on) {
                          val intent = VpnService.prepare(context)
                          if (intent != null) startActivityForResult(intent, reqVpn) else startVpn()
                      } else {
                          requireContext().stopService(Intent(requireContext(), DnsVpnService::class.java))
                          DnsVpnService.isRunning = false
                          requireContext().getSharedPreferences("smartblock", android.content.Context.MODE_PRIVATE).edit().putBoolean("vpn_was_on", false).apply()
                          status.text = "⚪ Защита выключена"
                      }
                  }
                  view.findViewById<Button>(R.id.updateButton).setOnClickListener {
                      Toast.makeText(context, "Обновление запущено...", Toast.LENGTH_SHORT).show()
                      thread { HostsUpdater.update(requireContext()) }
                  }
                  view.findViewById<Button>(R.id.testButton).setOnClickListener { runSelfTest() }

                  val handler = Handler(Looper.getMainLooper())
                  handler.post(object : Runnable {
                      override fun run() {
                          val b = DnsVpnService.blockedCount.get().toFloat()
                          val t = DnsVpnService.totalCount.get().toFloat()
                          stats.blocked = b; stats.total = t; stats.invalidate()
                          statsText.text = "Заблокировано: " + b.toInt() + " из " + t.toInt()
                          handler.postDelayed(this, 1000)
                      }
                  })
              }
              private fun runSelfTest() {
                  Toast.makeText(context, "Диагностика...", Toast.LENGTH_SHORT).show()
                  thread {
                      val text = SelfTest.formatResults(SelfTest.runAll(requireContext()))
                      activity?.runOnUiThread { AlertDialog.Builder(requireContext()).setTitle("🧪 Диагностика").setMessage(text).setPositiveButton("Ок", null).show() }
                  }
              }
              private fun startVpn() {
                  ContextCompat.startForegroundService(requireContext(), Intent(requireContext(), DnsVpnService::class.java))
                  DnsVpnService.isRunning = true
                  requireContext().getSharedPreferences("smartblock", android.content.Context.MODE_PRIVATE).edit().putBoolean("vpn_was_on", true).apply()
