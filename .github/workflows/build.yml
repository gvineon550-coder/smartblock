          GNU General Public License for more details.

          You should have received a copy of the GNU General Public License
          along with this program. If not, see <https://www.gnu.org/licenses/>.
          EOF

      - name: Set version from run number
        run: |
          VERSION_NAME="5.1.1.${{ github.run_number }}"
          sed -i "s/versionCode = 16/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
          sed -i "s/versionName = \"5.1.1\"/versionName = \"${VERSION_NAME}\"/" app/build.gradle.kts

      - uses: android-actions/setup-android@v4
        with: { packages: 'platforms;android-34' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk "SmartBlock-v5.1.1.${{ github.run_number }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.1.1.${{ github.run_number }}
          name: SmartBlock v5.1.1.${{ github.run_number }}
          body: |
            🛠 **SmartBlock v5.1.1 (Багфикс)**
            - Исправлена ошибка компиляции Kotlin (`vpn = null!!`).
          files: SmartBlock-v*.apk
          draft: false
          prerelease: false
