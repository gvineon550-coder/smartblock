          cat > app/src/main/java/com/gvineon550/smartblock/App.kt << 'EOF'
          package com.gvineon550.smartblock

          import android.app.Application
          import android.content.Context
          import androidx.work.*
          import java.io.PrintWriter
          import java.io.StringWriter
          import java.util.concurrent.TimeUnit

          class App : Application() {
              override fun onCreate() {
                  super.onCreate()
                  val defaultHandler = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { thread, throwable ->
                      val sw = StringWriter()
                      throwable.printStackTrace(PrintWriter(sw))
                      getSharedPreferences("crash", Context.MODE_PRIVATE)
                          .edit().putString("log", sw.toString()).apply()
                      defaultHandler?.uncaughtException(thread, throwable)
                  }
                  setupWorkers()
              }

              private fun setupWorkers() {
                  val constraints = Constraints.Builder().setRequiredNetworkType(NetworkType.CONNECTED).build()
                  
                  val watchdog = PeriodicWorkRequestBuilder<WatchdogWorker>(15, TimeUnit.MINUTES).build()
                  WorkManager.getInstance(this).enqueueUniquePeriodicWork("Watchdog", ExistingPeriodicWorkPolicy.KEEP, watchdog)

                  val updateLists = PeriodicWorkRequestBuilder<UpdateWorker>(24, TimeUnit.HOURS)
                      .setConstraints(constraints).build()
                  WorkManager.getInstance(this).enqueueUniquePeriodicWork("UpdateLists", ExistingPeriodicWorkPolicy.KEEP, updateLists)
              }
          }
          EOF

          cat > app/src/main/java/com/gvineon550/smartblock/BootReceiver.kt << 'EOF'
          package com.gvineon550.smartblock

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import androidx.core.content.ContextCompat

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == Intent.ACTION_BOOT_COMPLETED) {
                      val prefs = context.getSharedPreferences("smartblock", Context.MODE_PRIVATE)
                      if (prefs.getBoolean("auto_start", false)) {
                          ContextCompat.startForegroundService(context, Intent(context, DnsVpnService::class.java))
                      }
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/gvineon550/smartblock/Workers.kt << 'EOF'
          package com.gvineon550.smartblock

          import android.content.Context
          import android.content.Intent
          import androidx.core.content.ContextCompat
          import androidx.work.Worker
          import androidx.work.WorkerParameters

          class WatchdogWorker(ctx: Context, params: WorkerParameters) : Worker(ctx, params) {
              override fun doWork(): Result {
                  val prefs = applicationContext.getSharedPreferences("smartblock", Context.MODE_PRIVATE)
                  if (prefs.getBoolean("vpn_was_on", false) && !DnsVpnService.isRunning) {
                      ContextCompat.startForegroundService(applicationContext, Intent(applicationContext, DnsVpnService::class.java))
                  }
                  return Result.success()
              }
          }

          class UpdateWorker(ctx: Context, params: WorkerParameters) : Worker(ctx, params) {
              override fun doWork(): Result {
                  try { HostsUpdater.update(applicationContext) } catch (e: Exception) {}
                  return Result.success()
              }
          }
          EOF

          cat > app/src/main/java/com/gvineon550/smartblock/MainActivity.kt << 'EOF'
          package com.gvineon550.smartblock

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.net.VpnService
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.provider.Settings
          import android.view.View
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.appcompat.widget.SwitchCompat
          import androidx.core.content.ContextCompat
          import kotlin.concurrent.thread

          class MainActivity : AppCompatActivity() {
              private val reqVpn = 100
              private val prefs by lazy { getSharedPreferences("smartblock", Context.MODE_PRIVATE) }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  FilterEngine.loadDefaults(this)
                  checkCrashLog()
                  setupUI()
              }

              private fun setupUI() {
                  val swVpn = findViewById<SwitchCompat>(R.id.vpnSwitch)
                  val swDoh = findViewById<SwitchCompat>(R.id.dohSwitch)
                  val swAutoStart = findViewById<SwitchCompat>(R.id.autoStartSwitch)
                  val spinnerDoh = findViewById<Spinner>(R.id.dohSpinner)
                  val status = findViewById<TextView>(R.id.statusText)
                  val stats = findViewById<TextView>(R.id.statsText)
                  val logText = findViewById<TextView>(R.id.logText)
                  val searchInput = findViewById<EditText>(R.id.searchInput)

                  val providers = arrayOf("AdGuard", "Comss.one", "TurtleGuard", "OpenBLD", "Quad9")
                  val adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, providers)
                  spinnerDoh.adapter = adapter
                  spinnerDoh.setSelection(prefs.getInt("doh_provider", 0))
                  DnsVpnService.setDoHProvider(prefs.getInt("doh_provider", 0))

                  spinnerDoh.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                          DnsVpnService.setDoHProvider(position)
                          prefs.edit().putInt("doh_provider", position).apply()
                      }
                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  }

                  swVpn.isChecked = DnsVpnService.isRunning
                  swDoh.isChecked = DnsVpnService.useDoH
                  swAutoStart.isChecked = prefs.getBoolean("auto_start", false)
                  status.text = if (DnsVpnService.isRunning) "🟢 Защита включена" else "⚪ Защита выключена"

                  swVpn.setOnCheckedChangeListener { _, on ->
                      if (on) {
                          val intent = VpnService.prepare(this)
                          if (intent != null) startActivityForResult(intent, reqVpn) else startVpn()
                      } else {
                          stopService(Intent(this, DnsVpnService::class.java))
                          DnsVpnService.isRunning = false
                          prefs.edit().putBoolean("vpn_was_on", false).apply()
                          status.text = "⚪ Защита выключена"
                      }
                  }

                  swDoh.setOnCheckedChangeListener { _, on -> DnsVpnService.useDoH = on }
                  swAutoStart.setOnCheckedChangeListener { _, on -> prefs.edit().putBoolean("auto_start", on).apply() }

                  findViewById<Button>(R.id.addButton).setOnClickListener {
                      val d = findViewById<EditText>(R.id.domainInput).text.toString().trim().lowercase()
                      if (d.isNotEmpty()) { FilterEngine.addBlocked(d, this); Toast.makeText(this, "Заблокирован", Toast.LENGTH_SHORT).show() }
                  }
                  findViewById<Button>(R.id.addWhiteButton).setOnClickListener {
                      val d = findViewById<EditText>(R.id.domainInput).text.toString().trim().lowercase()
                      if (d.isNotEmpty()) { FilterEngine.addWhitelist(d, this); Toast.makeText(this, "В белом списке", Toast.LENGTH_SHORT).show() }
                  }
                  findViewById<Button>(R.id.updateButton).setOnClickListener {
                      thread { HostsUpdater.update(this) }
                      Toast.makeText(this, "Обновление запущено", Toast.LENGTH_SHORT).show()
                  }
                  findViewById<Button>(R.id.checkUpdateButton).setOnClickListener {
                      UpdateChecker.check(this) { res -> runOnUiThread { handleUpdate(res) } }
                  }
                  findViewById<Button>(R.id.batteryButton).setOnClickListener {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                          startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply { data = Uri.parse("package:$packageName") })
                      } else Toast.makeText(this, "Уже разрешено", Toast.LENGTH_SHORT).show()
                  }

                  searchInput.addTextChangedListener(object : android.text.TextWatcher {
                      override fun afterTextChanged(s: android.text.Editable?) { logText.text = BlockLog.filter(s.toString()) }
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                  })

                  val handler = Handler(Looper.getMainLooper())
                  handler.post(object : Runnable {
                      override fun run() {
                          stats.text = "Заблокировано: ${DnsVpnService.blockedCount}"
                          if (searchInput.text.isNullOrEmpty()) logText.text = BlockLog.getLog()
                          handler.postDelayed(this, 2000)
                      }
                  })
              }

              private fun handleUpdate(res: UpdateChecker.UpdateResult) {
                  when (res) {
                      is UpdateChecker.UpdateResult.Available -> AlertDialog.Builder(this).setTitle("Доступно обновление").setMessage("Новая версия: ${res.version}. Скачать?")
                          .setPositiveButton("Да") { _, _ -> UpdateChecker.download(this, res.url) }.setNegativeButton("Нет", null).show()
                      is UpdateChecker.UpdateResult.Latest -> Toast.makeText(this, "Последняя версия", Toast.LENGTH_SHORT).show()
                      is UpdateChecker.UpdateResult.Error -> Toast.makeText(this, "Ошибка: ${res.message}", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun checkCrashLog() {
                  val log = getSharedPreferences("crash", Context.MODE_PRIVATE).getString("log", null)
                  if (log != null) {
                      AlertDialog.Builder(this).setTitle("Упало в прошлый раз").setMessage(log.take(1000)).setPositiveButton("Ок") { _, _ -> getSharedPreferences("crash", Context.MODE_PRIVATE).edit().clear().apply() }.show()
                  }
              }

              private fun startVpn() {
                  ContextCompat.startForegroundService(this, Intent(this, DnsVpnService::class.java))
                  DnsVpnService.isRunning = true
                  prefs.edit().putBoolean("vpn_was_on", true).apply()
                  findViewById<TextView>(R.id.statusText).text = "🟢 Защита включена"
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == reqVpn && resultCode == Activity.RESULT_OK) startVpn()
              }
          }
          EOF

          cat > app/src/main/java/com/gvineon550/smartblock/UpdateChecker.kt << 'EOF'
          package com.gvineon550.smartblock

          import android.app.DownloadManager
          import android.content.Context
          import android.net.Uri
          import android.os.Environment
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONObject
          import java.util.concurrent.TimeUnit

          object UpdateChecker {
              // ВАШИ ДАННЫЕ РЕПОЗИТОРИЯ
              private const val OWNER = "gvineon550-coder"
              private const val REPO = "smartblock"
              private const val API_URL = "https://api.github.com/repos/$OWNER/$REPO/releases/latest"

              sealed class UpdateResult {
                  data class Available(val version: String, val url: String) : UpdateResult()
                  data class Latest(val version: String) : UpdateResult()
                  data class Error(val message: String) : UpdateResult()
              }

              fun check(context: Context, callback: (UpdateResult) -> Unit) {
                  CoroutineScope(Dispatchers.IO).launch {
                      try {
                          val request = Request.Builder().url(API_URL).header("Accept", "application/vnd.github.v3+json").build()
                          OkHttpClient.Builder().connectTimeout(10, TimeUnit.SECONDS).build().newCall(request).execute().use { response ->
                              if (!response.isSuccessful) { callback(UpdateResult.Error("HTTP ${response.code}")); return@launch }
                              val json = JSONObject(response.body?.string() ?: "")
                              val newVersion = json.optString("tag_name", "").trimStart('v', 'V')
                              val assets = json.optJSONArray("assets")
                              var downloadUrl = ""
                              if (assets != null) {
                                  for (i in 0 until assets.length()) {
                                      if (assets.getJSONObject(i).optString("name", "").endsWith(".apk")) {
                                          downloadUrl = assets.getJSONObject(i).optString("browser_download_url", ""); break
                                      }
                                  }
                              }
                              val currentVersion = context.packageManager.getPackageInfo(context.packageName, 0).versionName ?: "0"
                              if (isNewer(newVersion, currentVersion)) callback(UpdateResult.Available(newVersion, downloadUrl))
                              else callback(UpdateResult.Latest(newVersion))
                          }
                      } catch (e: Exception) { callback(UpdateResult.Error(e.localizedMessage ?: "Err")) }
                  }
              }
              private fun isNewer(n: String, o: String): Boolean {
                  val np = n.split(".").mapNotNull { it.toIntOrNull() }
                  val op = o.split(".").mapNotNull { it.toIntOrNull() }
                  for (i in 0 until maxOf(np.size, op.size)) {
                      if (np.getOrElse(i) { 0 } > op.getOrElse(i) { 0 }) return true
                      if (np.getOrElse(i) { 0 } < op.getOrElse(i) { 0 }) return false
                  }
                  return false
              }
              fun download(context: Context, url: String) {
                  val request = DownloadManager.Request(Uri.parse(url))
                      .setTitle("SmartBlock Update").setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, "SmartBlock-update.apk")
                      .setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                  (context.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager).enqueue(request)
              }
          }
          EOF

          cat > app/src/main/java/com/gvineon550/smartblock/BlockLog.kt << 'EOF'
          package com.gvineon550.smartblock

          import java.text.SimpleDateFormat
          import java.util.*

          object BlockLog {
              private val logs = LinkedList<String>()
              private val format = SimpleDateFormat("HH:mm:ss", Locale.getDefault())

              fun add(domain: String) {
                  synchronized(logs) {
                      logs.addFirst("${format.format(Date())} - $domain")
                      if (logs.size > 100) logs.removeLast()
                  }
              }

              fun getLog(): String {
                  synchronized(logs) { return if (logs.isEmpty()) "Лог пуст." else logs.joinToString("\n") }
              }

              fun filter(query: String): String {
                  synchronized(logs) {
                      val q = query.lowercase()
                      return logs.filter { it.contains(q) }.joinToString("\n").ifEmpty { "Ничего не найдено" }
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/gvineon550/smartblock/DnsVpnService.kt << 'EOF'
          package com.gvineon550.smartblock

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.net.VpnService
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.os.ParcelFileDescriptor
          import android.os.PowerManager
          import androidx.core.app.NotificationCompat
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.net.DatagramPacket
          import java.net.DatagramSocket
          import java.net.InetAddress
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicLong

          class DnsVpnService : VpnService() {
              companion object {
                  @Volatile var isRunning = false
                  @Volatile var useDoH = false
                  val blockedCount = AtomicLong(0)
                  private const val CHANNEL = "smartblock"
                  private const val NOTIF = 1
                  private val DOH_PROVIDERS = listOf(
                      "https://dns.adguard-dns.com/dns-query", "https://dns.comss.one/dns-query",
                      "https://dns.turtleguard.cloud/dns-query", "https://doh.openbld.net/dns-query",
                      "https://dns.quad9.net/dns-query"
                  )
                  private var currentProvider = 0
                  fun setDoHProvider(index: Int) { if (index in DOH_PROVIDERS.indices) currentProvider = index }
              }

              private var vpn: ParcelFileDescriptor? = null
              private var worker: Thread? = null
              private var wakeLock: PowerManager.WakeLock? = null
              private var wifiLock: WifiManager.WifiLock? = null
              private val upstream = InetAddress.getByName("1.1.1.1")
              private val httpClient = OkHttpClient.Builder().connectTimeout(5, TimeUnit.SECONDS).build()
              
              private val dnsCache = object : android.util.LruCache<String, ByteArray>(1000) {}

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (vpn != null) return START_STICKY
                  createChannel()
                  startForeground(NOTIF, buildNotif())
                  acquireLocks()
                  
                  vpn = Builder()
                      .setSession("SmartBlock")
                      .addAddress("10.0.0.2", 32)
                      .addDnsServer("10.0.0.1")
                      .addRoute("10.0.0.1", 32)
                      .addAddress("fd00::2", 128)
                      .addDnsServer("fd00::1")
                      .addRoute("fd00::1", 128)
                      .setBlocking(true)
                      .establish() ?: return START_NOT_STICKY
                      
                  isRunning = true
                  worker = Thread { run() }.also { it.start() }
                  return START_STICKY
              }

              private fun acquireLocks() {
                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "SmartBlock::WakeLock")
                  wakeLock?.acquire(10 * 60 * 1000L)
                  val wm = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                  wifiLock = wm.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, "SmartBlock::WifiLock")
                  wifiLock?.acquire()
              }

              private fun run() {
                  val pfd = vpn ?: return
                  FileInputStream(pfd.fileDescriptor).use { input ->
                      FileOutputStream(pfd.fileDescriptor).use { output ->
                          val buf = ByteArray(32767)
                          val sock = DatagramSocket().also { protect(it); it.soTimeout = 3000 }
                          while (isRunning) {
                              val n = try { input.read(buf) } catch (e: Exception) { break }
                              if (n > 0) try { handle(buf.copyOf(n), output, sock) } catch (e: Exception) {}
                          }
                      }
                  }
              }

              private fun handle(pkt: ByteArray, out: FileOutputStream, sock: DatagramSocket) {
                  if (pkt.size < 28) return
                  val isV4 = ((pkt[0].toInt() ushr 4) and 0xF) == 4
                  if (isV4 && (pkt[9].toInt() and 0xFF) == 17) {
                      val ihl = (pkt[0].toInt() and 0xF) * 4
                      val total = ((pkt[2].toInt() and 0xFF) shl 8) or (pkt[3].toInt() and 0xFF)
                      if (ihl + 8 > total || ihl + 8 > pkt.size) return
                      val srcIp = pkt.copyOfRange(12, 16)
                      val dstIp = pkt.copyOfRange(16, 20)
                      val srcPort = ((pkt[ihl].toInt() and 0xFF) shl 8) or (pkt[ihl + 1].toInt() and 0xFF)
                      val dstPort = ((pkt[ihl + 2].toInt() and 0xFF) shl 8) or (pkt[ihl + 3].toInt() and 0xFF)
                      if (dstPort != 53) return
                      val udpLen = ((pkt[ihl + 4].toInt() and 0xFF) shl 8) or (pkt[ihl + 5].toInt() and 0xFF)
                      val dns = pkt.copyOfRange(ihl + 8, ihl + udpLen)
                      processDns(dns, out, sock, dstIp, srcIp, srcPort)
                  }
              }

              private fun processDns(dns: ByteArray, out: FileOutputStream, sock: DatagramSocket, dstIp: ByteArray, srcIp: ByteArray, srcPort: Int) {
                  val domain = DnsPacket.parseDomain(dns) ?: return
                  if (FilterEngine.isBlocked(domain)) {
                      blockedCount.incrementAndGet()
                      BlockLog.add(domain)
                      out.write(buildIpUdp(dstIp, srcIp, 53, srcPort, DnsPacket.buildNxdomain(dns)))
                      return
                  }
                  
                  val cached = dnsCache.get(domain)
                  if (cached != null) {
                      out.write(buildIpUdp(dstIp, srcIp, 53, srcPort, cached))
                      return
                  }

                  if (useDoH) sendDoH(dns, out, dstIp, srcIp, srcPort, domain)
                  else sendUDP(dns, out, sock, dstIp, srcIp, srcPort, domain)
              }

              private fun sendUDP(dns: ByteArray, out: FileOutputStream, sock: DatagramSocket, dstIp: ByteArray, srcIp: ByteArray, srcPort: Int, key: String) {
                  try {
                      sock.send(DatagramPacket(dns, dns.size, upstream, 53))
                      val rb = ByteArray(4096)
                      val rp = DatagramPacket(rb, rb.size)
                      sock.receive(rp)
                      val resp = rb.copyOf(rp.length)
                      dnsCache.put(key, resp)
                      out.write(buildIpUdp(dstIp, srcIp, 53, srcPort, resp))
                  } catch (e: Exception) {}
              }

              private fun sendDoH(dns: ByteArray, out: FileOutputStream, dstIp: ByteArray, srcIp: ByteArray, srcPort: Int, key: String) {
                  try {
                      val body = dns.toRequestBody("application/dns-message".toMediaType())
                      val request = Request.Builder().url(DOH_PROVIDERS[currentProvider]).post(body).header("Accept", "application/dns-message").build()
                      httpClient.newCall(request).execute().use { resp ->
                          if (resp.isSuccessful && resp.body != null) {
                              val bytes = resp.body!!.bytes()
                              dnsCache.put(key, bytes)
                              out.write(buildIpUdp(dstIp, srcIp, 53, srcPort, bytes))
                          }
                      }
                  } catch (e: Exception) {
                      val s = DatagramSocket(); protect(s); sendUDP(dns, out, s, dstIp, srcIp, srcPort, key); s.close()
                  }
              }

              private fun buildIpUdp(src: ByteArray, dst: ByteArray, sp: Int, dp: Int, payload: ByteArray): ByteArray {
                  val udpLen = 8 + payload.size
                  val p = ByteArray(20 + udpLen)
                  p[0] = 0x45; p[2] = ((p.size shr 8) and 0xFF).toByte(); p[3] = (p.size and 0xFF).toByte()
                  p[6] = 0x40; p[8] = 64; p[9] = 17
                  System.arraycopy(src, 0, p, 12, 4); System.arraycopy(dst, 0, p, 16, 4)
                  val sum = DnsPacket.checksum(p, 0, 20)
                  p[10] = ((sum shr 8) and 0xFF).toByte(); p[11] = (sum and 0xFF).toByte()
                  p[20] = ((sp shr 8) and 0xFF).toByte(); p[21] = (sp and 0xFF).toByte()
                  p[22] = ((dp shr 8) and 0xFF).toByte(); p[23] = (dp and 0xFF).toByte()
                  p[24] = ((udpLen shr 8) and 0xFF).toByte(); p[25] = (udpLen and 0xFF).toByte()
                  System.arraycopy(payload, 0, p, 28, payload.size)
                  return p
              }

              override fun onRevoke() {
                  isRunning = false
                  stopSelf()
                  super.onRevoke()
              }

              override fun onDestroy() {
                  isRunning = false; worker?.interrupt(); vpn?.close(); vpn = null
                  wakeLock?.let { if (it.isHeld) it.release() }
                  wifiLock?.let { if (it.isHeld) it.release() }
                  super.onDestroy()
              }

              private fun createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      getSystemService(NotificationManager::class.java).createNotificationChannel(NotificationChannel(CHANNEL, "SmartBlock", NotificationManager.IMPORTANCE_LOW))
                  }
              }
              private fun buildNotif(): Notification {
                  val pi = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  return NotificationCompat.Builder(this, CHANNEL).setContentTitle("SmartBlock защищает").setContentText("Фильтрация DNS активна")
                      .setSmallIcon(android.R.drawable.ic_lock_lock).setContentIntent(pi).setOngoing(true).build()
              }
          }
          EOF

