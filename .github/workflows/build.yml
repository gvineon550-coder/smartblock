      - name: Set version from run number
        run: |
          VERSION_NAME="4.4.1.${{ github.run_number }}"
          sed -i "s/versionCode = 11/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
          sed -i "s/versionName = \"4.4.1\"/versionName = \"${VERSION_NAME}\"/" app/build.gradle.kts

      - uses: android-actions/setup-android@v4
        with: { packages: 'platforms;android-34' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk "SmartBlock-v4.4.1.${{ github.run_number }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.4.1.${{ github.run_number }}
          name: SmartBlock v4.4.1.${{ github.run_number }}
          body: |
            🛠 **SmartBlock v4.4.1 (Багфикс)**
            - Исправлена ошибка компиляции в `SelfTest.kt` (синтаксис Kotlin).
            - Добавлена встроенная диагностика работы.
          files: SmartBlock-v*.apk
          draft: false
          prerelease: false
