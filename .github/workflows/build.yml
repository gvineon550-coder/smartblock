          package com.gvineon550.smartblock

          import android.content.Context
          import java.net.InetAddress
          import java.net.UnknownHostException

          object SelfTest {
              data class Result(val name: String, val status: Status, val details: String)
              enum class Status { PASSED, FAILED, SKIPPED }
              fun runAll(ctx: Context): List<Result> {
                  val r = mutableListOf<Result>()
                  val vpn = DnsVpnService.isRunning
                  r.add(Result("VPN", if (vpn) Status.PASSED else Status.FAILED, if (vpn) "Активен" else "Выключен"))
                  val count = FilterEngine.getDomainCount()
                  r.add(Result("Списки", if (count > 1000) Status.PASSED else Status.FAILED, "Доменов: $count"))
                  if (!vpn) r.add(Result("Перехват DNS", Status.SKIPPED, "Нужен VPN")) else {
                      val t = "self-test-${System.currentTimeMillis()}.doubleclick.net"
                      try { InetAddress.getByName(t); r.add(Result("Перехват DNS", Status.FAILED, "Не работает")) }
                      catch (e: UnknownHostException) { r.add(Result("Перехват DNS", Status.PASSED, "Заблокирован")) }
                  }
                  return r
              }
              fun formatResults(res: List<Result>): String {
                  val sb = StringBuilder(); var p = 0; var f = 0; var s = 0
                  res.forEach { r ->
                      val i = when(r.status) { Status.PASSED -> {p++; "✅"}; Status.FAILED -> {f++; "❌"}; Status.SKIPPED -> {s++; "⏭️"} }
                      sb.append("$i ${r.name}\n   ${r.details}\n\n")
                  }
                  sb.append("──────────\nИтого: $p пройдено, $f провалено, $s пропущено")
                  return sb.toString()
              }
          }
