          cat > app/src/main/java/com/gvineon550/smartblock/ListsFragment.kt << 'EOF'
          package com.gvineon550.smartblock

          import android.content.Context
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.view.Gravity
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.fragment.app.Fragment

          class ListsFragment : Fragment() {
              override fun onCreateView(inflater: LayoutInflater, container: ViewGroup?, savedInstanceState: Bundle?): View? {
                  return inflater.inflate(R.layout.fragment_lists, container, false)
              }

              override fun onViewCreated(view: View, savedInstanceState: Bundle?) {
                  val input = view.findViewById<EditText>(R.id.domainInput)
                  val blockBtn = view.findViewById<Button>(R.id.addBlockBtn)
                  val whiteBtn = view.findViewById<Button>(R.id.addWhiteBtn)
                  val bulkInput = view.findViewById<EditText>(R.id.bulkInput)
                  val importBtn = view.findViewById<Button>(R.id.importBtn)
                  val fileBtn = view.findViewById<Button>(R.id.fileBtn)
                  val blockContainer = view.findViewById<LinearLayout>(R.id.blockListContainer)
                  val whiteContainer = view.findViewById<LinearLayout>(R.id.whiteListContainer)

                  fun parseAndAdd(text: String): Int {
                      var count = 0
                      text.lines().forEach { line ->
                          val cleanLine = line.substringBefore('#').trim()
                          if (cleanLine.isNotEmpty()) {
                              val parts = cleanLine.split(Regex("\\s+"))
                              val domain = if (parts.size >= 2) parts[1] else parts[0]
                              if (domain.isNotEmpty() && domain.contains(".") && domain != "0.0.0.0" && domain != "127.0.0.1") {
                                  FilterEngine.addBlocked(domain.lowercase(), requireContext())
                                  count++
                              }
                          }
                      }
                      return count
                  }

                  fun refreshLists() {
                      val p = requireContext().getSharedPreferences("smartblock", Context.MODE_PRIVATE)
                      val b = p.getStringSet("user_block", emptySet()) ?: emptySet()
                      val w = p.getStringSet("user_white", emptySet()) ?: emptySet()
                      renderList(blockContainer, b, false, ::refreshLists)
                      renderList(whiteContainer, w, true, ::refreshLists)
                  }
                  refreshLists()

                  val filePicker = registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri: Uri? ->
                      if (uri != null) {
                          try {
                              val text = requireContext().contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() }
                              if (text != null) {
                                  val count = parseAndAdd(text)
