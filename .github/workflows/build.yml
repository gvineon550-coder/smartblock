          cat > app/src/main/java/com/gvineon550/smartblock/App.kt << 'EOF'
          package com.gvineon550.smartblock

          import android.app.Application
          import android.content.Context
          import androidx.work.*
          import java.io.PrintWriter
          import java.io.StringWriter
          import java.util.concurrent.TimeUnit

          class App : Application() {
              override fun onCreate() {
                  super.onCreate()
                  val defaultHandler = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { thread, throwable ->
                      val sw = StringWriter()
                      throwable.printStackTrace(PrintWriter(sw))
                      getSharedPreferences("crash", Context.MODE_PRIVATE).edit().putString("log", sw.toString()).apply()
                      defaultHandler?.uncaughtException(thread, throwable)
                  }
                  setupWorkers()
              }
              private fun setupWorkers() {
                  val constraints = Constraints.Builder().setRequiredNetworkType(NetworkType.CONNECTED).build()
                  val watchdog = PeriodicWorkRequestBuilder<WatchdogWorker>(15, TimeUnit.MINUTES).build()
                  WorkManager.getInstance(this).enqueueUniquePeriodicWork("Watchdog", ExistingPeriodicWorkPolicy.KEEP, watchdog)
                  val updateLists = PeriodicWorkRequestBuilder<UpdateWorker>(24, TimeUnit.HOURS).setConstraints(constraints).build()
                  WorkManager.getInstance(this).enqueueUniquePeriodicWork("UpdateLists", ExistingPeriodicWorkPolicy.KEEP, updateLists)
              }
          }
          EOF

          cat > app/src/main/java/com/gvineon550/smartblock/BootReceiver.kt << 'EOF'
          package com.gvineon550.smartblock

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import androidx.core.content.ContextCompat

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == Intent.ACTION_BOOT_COMPLETED) {
                      if (context.getSharedPreferences("smartblock", Context.MODE_PRIVATE).getBoolean("auto_start", false)) {
                          ContextCompat.startForegroundService(context, Intent(context, DnsVpnService::class.java))
                      }
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/gvineon550/smartblock/Workers.kt << 'EOF'
          package com.gvineon550.smartblock

          import android.content.Context
          import android.content.Intent
          import androidx.core.content.ContextCompat
          import androidx.work.Worker
          import androidx.work.WorkerParameters

          class WatchdogWorker(ctx: Context, params: WorkerParameters) : Worker(ctx, params) {
              override fun doWork(): Result {
                  val prefs = applicationContext.getSharedPreferences("smartblock", Context.MODE_PRIVATE)
                  if (prefs.getBoolean("vpn_was_on", false) && !DnsVpnService.isRunning) {
                      ContextCompat.startForegroundService(applicationContext, Intent(applicationContext, DnsVpnService::class.java))
                  }
                  return Result.success()
              }
          }
          class UpdateWorker(ctx: Context, params: WorkerParameters) : Worker(ctx, params) {
              override fun doWork(): Result {
                  try { HostsUpdater.update(applicationContext) } catch (e: Exception) {}
                  return Result.success()
              }
          }
          EOF

          cat > app/src/main/java/com/gvineon550/smartblock/MainActivity.kt << 'EOF'
          package com.gvineon550.smartblock

          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import androidx.fragment.app.Fragment
          import com.google.android.material.bottomnavigation.BottomNavigationView

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  val nav = findViewById<BottomNavigationView>(R.id.bottom_nav)
                  nav.setOnItemSelectedListener { item ->
                      var fragment: Fragment? = null
                      when (item.itemId) {
                          R.id.nav_home -> fragment = HomeFragment()
                          R.id.nav_logs -> fragment = LogsFragment()
                          R.id.nav_lists -> fragment = ListsFragment()
                          R.id.nav_settings -> fragment = SettingsFragment()
                      }
                      if (fragment != null) {
                          supportFragmentManager.beginTransaction().replace(R.id.fragment_container, fragment).commit()
                          true
                      } else false
                  }
                  if (savedInstanceState == null) nav.selectedItemId = R.id.nav_home
              }
          }
          EOF

          cat > app/src/main/java/com/gvineon550/smartblock/SelfTest.kt << 'EOF'
          package com.gvineon550.smartblock

          import android.content.Context
          import java.net.HttpURLConnection
          import java.net.InetAddress
          import java.net.URL
          import java.net.UnknownHostException

          object SelfTest {
              data class Result(val name: String, val status: Status, val details: String)
              enum class Status { PASSED, FAILED, SKIPPED }

              fun runAll(ctx: Context): List<Result> {
                  val results = mutableListOf<Result>()

                  // 1. VPN
                  val vpnRunning = DnsVpnService.isRunning
                  results.add(Result(
                      "VPN-сервис",
                      if (vpnRunning) Status.PASSED else Status.FAILED,
                      if (vpnRunning) "Активен" else "Не запущен — включите защиту на главной"
                  ))

                  // 2. Списки
                  val domainCount = FilterEngine.getDomainCount()
                  val listStatus = when {
                      domainCount > 1000 -> Status.PASSED
                      domainCount > 0 -> Status.SKIPPED
                      else -> Status.FAILED
                  }
                  val listHint = when {
                      domainCount > 1000 -> "Загружено доменов: $domainCount"
                      domainCount > 0 -> "Мало доменов ($domainCount) — нажмите «Обновить списки»"
                      else -> "Списки пусты — обновите из интернета"
                  }
                  results.add(Result("Списки блокировки", listStatus, listHint))

                  // 3. Перехват DNS (end-to-end)
                  if (!vpnRunning) {
                      results.add(Result("Перехват DNS", Status.SKIPPED, "Нужен активный VPN"))
                  } else {
                      val testDomain = "self-test-${System.currentTimeMillis()}.doubleclick.net"
                      val t0 = System.currentTimeMillis()
                      try {
                          InetAddress.getByName(testDomain)
                          results.add(Result(
                              "Перехват DNS",
                              Status.FAILED,
                              "$testDomain разрешился — фильтр не работает"
                          ))
                      } catch (e: UnknownHostException) {
                          val ms = System.currentTimeMillis() - t0
                          results.add(Result(
                              "Перехват DNS",
                              Status.PASSED,
                              "Тестовый домен заблокирован (${ms}мс)"
                          ))
                      } catch (e: Exception) {
                          results.add(Result(
                              "Перехват DNS",
                              Status.FAILED,
                              "Ошибка: ${e.message}"
                          ))
                      }
                  }

                  // 4. Белый список
                  val whitelisted = FilterEngine.getWhitelistSample()
                  if (whitelisted == null) {
                      results.add(Result("Белый список", Status.SKIPPED, "Нет доменов в белом списке"))
                  } else {
                      try {
                          InetAddress.getByName(whitelisted)
                          results.add(Result("Белый список", Status.PASSED, "$whitelisted разрешается"))
                      } catch (e: Exception) {
                          results.add(Result("Белый список", Status.FAILED, "$whitelisted не разрешается"))
                      }
                  }

                  // 5. DoH
                  if (!DnsVpnService.useDoH) {
                      results.add(Result("DoH-сервер", Status.SKIPPED, "DoH выключен, используется UDP"))
                  } else {
                      try {
                          val dohUrl = DnsVpnService.getCurrentDoHProviderUrl()
                          val host = URL(dohUrl).host
                          val t0 = System.currentTimeMillis()
                          val conn = URL("https://$host").openConnection() as HttpURLConnection
                          conn.connectTimeout = 3000
                          conn.readTimeout = 3000
                          conn.requestMethod = "HEAD"
                          try { conn.responseCode } catch (_: Exception) {}
                          conn.disconnect()
                          val ms = System.currentTimeMillis() - t0
                          if (ms < 3000) {
                              results.add(Result("DoH-сервер", Status.PASSED, "$host доступен (${ms}мс)"))
                          } else {
                              results.add(Result("DoH-сервер", Status.FAILED, "$host медленный или недоступен (${ms}мс)"))
                          }
                      } catch (e: Exception) {
                          results.add(Result("DoH-сервер", Status.FAILED, "Недоступен: ${e.message}"))
                      }
                  }

                  return results
              }

              fun formatResults(results: List<Result>): String {
                  val sb = StringBuilder()
                  var passed = 0; var failed = 0; var skipped = 0
                  results.forEach { r ->
                      val icon = when (r.status) {
                          Status.PASSED -> { passed++; "✅" }
                          Status.FAILED -> { failed++; "❌" }
                          Status.SKIPPED -> { skipped++; "⏭️" }
                      }
                      sb.append("$icon ${r.name}\n     ${r.details}\n\n")
                  }
                  sb.append("───────────────\n")
                  sb.append("Итого: $passed пройдено, $failed провалено, $skipped пропущено")
                  return sb.toString()
              }
          }
          EOF

          cat > app/src/main/java/com/gvineon550/smartblock/HostsSources.kt << 'EOF'
          package com.gvineon550.smartblock

          import android.content.Context

          object HostsSources {
              data class Source(val name: String, val url: String, val description: String)

              val DEFAULT_SOURCES = listOf(
                  Source("StevenBlack", "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts", "Реклама, трекеры, малварь"),
                  Source("AdGuard DNS", "https://raw.githubusercontent.com/r-a-y/mobile-hosts/master/AdguardDNS.txt", "Реклама и трекеры"),
                  Source("AdAway", "https://raw.githubusercontent.com/AdAway/adaway.github.io/master/hosts.txt", "Реклама (Android)"),
                  Source("Peter Lowe", "https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=0&mimetype=plaintext", "Реклама и трекеры"),
                  Source("URLHaus", "https://raw.githubusercontent.com/mitchellkrogza/Ultimate.Hosts.Blacklist/master/hosts/hosts0", "Малварь и фишинг")
              )

              private const val PREFS = "smartblock"
              private const val KEY_ENABLED = "enabled_sources"
              private const val KEY_CUSTOM = "custom_sources"

              fun getEnabledNames(ctx: Context): Set<String> {
                  return ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .getStringSet(KEY_ENABLED, DEFAULT_SOURCES.map { it.name }.toSet()) ?: DEFAULT_SOURCES.map { it.name }.toSet()
              }
              fun isEnabled(ctx: Context, name: String): Boolean = getEnabledNames(ctx).contains(name)
              fun setEnabled(ctx: Context, name: String, enabled: Boolean) {
                  val prefs = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  val current = prefs.getStringSet(KEY_ENABLED, DEFAULT_SOURCES.map { it.name }.toSet())?.toMutableSet() ?: mutableSetOf()
                  if (enabled) current.add(name) else current.remove(name)
                  prefs.edit().putStringSet(KEY_ENABLED, current).apply()
              }
              fun getCustomUrls(ctx: Context): Set<String> = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getStringSet(KEY_CUSTOM, emptySet()) ?: emptySet()
              fun addCustomUrl(ctx: Context, url: String) {
                  val prefs = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  val current = prefs.getStringSet(KEY_CUSTOM, emptySet())?.toMutableSet() ?: mutableSetOf()
                  current.add(url); prefs.edit().putStringSet(KEY_CUSTOM, current).apply()
              }
              fun removeCustomUrl(ctx: Context, url: String) {
                  val prefs = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  val current = prefs.getStringSet(KEY_CUSTOM, emptySet())?.toMutableSet() ?: mutableSetOf()
                  current.remove(url); prefs.edit().putStringSet(KEY_CUSTOM, current).apply()
              }
              fun getActiveUrls(ctx: Context): List<String> {
                  val enabled = getEnabledNames(ctx)
                  return DEFAULT_SOURCES.filter { enabled.contains(it.name) }.map { it.url } + getCustomUrls(ctx)
              }
          }
          EOF

          cat > app/src/main/java/com/gvineon550/smartblock/HomeFragment.kt << 'EOF'
          package com.gvineon550.smartblock

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.net.VpnService
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.widget.SwitchCompat
          import androidx.fragment.app.Fragment
          import kotlin.concurrent.thread

          class HomeFragment : Fragment() {
              private val reqVpn = 100
              override fun onCreateView(inflater: LayoutInflater, container: ViewGroup?, savedInstanceState: Bundle?): View? {
                  return inflater.inflate(R.layout.fragment_home, container, false)
              }
              override fun onViewCreated(view: View, savedInstanceState: Bundle?) {
                  val sw = view.findViewById<SwitchCompat>(R.id.vpnSwitch)
                  val status = view.findViewById<TextView>(R.id.statusText)
                  val stats = view.findViewById<TextView>(R.id.statsText)
                  sw.isChecked = DnsVpnService.isRunning
                  status.text = if (DnsVpnService.isRunning) "🟢 Защита включена" else "⚪ Защита выключена"

                  sw.setOnCheckedChangeListener { _, on ->
                      if (on) {
                          val intent = VpnService.prepare(context)
                          if (intent != null) startActivityForResult(intent, reqVpn) else startVpn()
                      } else {
                          requireContext().stopService(Intent(requireContext(), DnsVpnService::class.java))
                          DnsVpnService.isRunning = false
                          requireContext().getSharedPreferences("smartblock", android.content.Context.MODE_PRIVATE).edit().putBoolean("vpn_was_on", false).apply()
                          status.text = "⚪ Защита выключена"
                      }
                  }
                  view.findViewById<Button>(R.id.updateButton).setOnClickListener {
                      Toast.makeText(context, "Обновление запущено...", Toast.LENGTH_SHORT).show()
                      thread { HostsUpdater.update(requireContext()) }
                  }
                  view.findViewById<Button>(R.id.testButton).setOnClickListener { runSelfTest() }
                  val handler = Handler(Looper.getMainLooper())
                  handler.post(object : Runnable {
                      override fun run() {
                          stats.text = "Заблокировано запросов: ${DnsVpnService.blockedCount}"
                          handler.postDelayed(this, 1000)
                      }
                  })
              }

              private fun runSelfTest() {
                  Toast.makeText(context, "Выполняется диагностика...", Toast.LENGTH_SHORT).show()
                  thread {
                      val results = SelfTest.runAll(requireContext())
                      val text = SelfTest.formatResults(results)
                      activity?.runOnUiThread {
                          AlertDialog.Builder(requireContext())
                              .setTitle("🧪 Диагностика")
                              .setMessage(text)
                              .setPositiveButton("Ок", null)
                              .show()
                      }
                  }
              }

              private fun startVpn() {
                  androidx.core.content.ContextCompat.startForegroundService(requireContext(), Intent(requireContext(), DnsVpnService::class.java))
                  DnsVpnService.isRunning = true
                  requireContext().getSharedPreferences("smartblock", android.content.Context.MODE_PRIVATE).edit().putBoolean("vpn_was_on", true).apply()
                  view?.findViewById<TextView>(R.id.statusText)?.text = "🟢 Защита включена"
              }
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == reqVpn && resultCode == Activity.RESULT_OK) startVpn()
              }
          }
          EOF

