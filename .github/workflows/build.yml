      - name: Set version from run number
        run: |
          VERSION_NAME="3.0.${{ github.run_number }}"
          sed -i "s/versionCode = 5/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
          sed -i "s/versionName = \"3.0\"/versionName = \"${VERSION_NAME}\"/" app/build.gradle.kts

      - uses: android-actions/setup-android@v4
        with: { packages: 'platforms;android-34' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk "SmartBlock-v3.0.${{ github.run_number }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: SmartBlock v3.0.${{ github.run_number }}
          body: |
            Автоматический релиз SmartBlock v3.0 (Full Power).
            
            **Новое:**
            - 🚀 Умный DNS-кэш (экономия батареи)
            - 🛡️ Поддержка IPv6
            - 🔄 Автообновление списков и Watchdog (WorkManager)
            - 🔋 WifiLock + WakeLock
            - 🚀 Автозапуск после перезагрузки (BootReceiver)
            - 🎨 Поиск по логу и белый список
          files: SmartBlock-v*.apk
          draft: false
          prerelease: false
