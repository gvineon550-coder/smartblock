          cat > app/src/main/java/com/gvineon550/smartblock/DnsVpnService.kt << 'EOF'
          package com.gvineon550.smartblock

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.VpnService
          import android.net.wifi.WifiManager
          import android.os.ParcelFileDescriptor
          import android.os.PowerManager
          import androidx.core.app.NotificationCompat
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.net.DatagramPacket
          import java.net.DatagramSocket
          import java.net.InetAddress
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicLong

          class DnsVpnService : VpnService() {
              companion object {
                  @Volatile var isRunning = false
                  @Volatile var useDoH = false
                  val blockedCount = AtomicLong(0)
                  val totalCount = AtomicLong(0)
                  private var currentProvider = 0
                  private var plainDnsIp = "1.1.1.1"
                  private val DOH = listOf("https://dns.adguard-dns.com/dns-query", "https://dns.comss.one/dns-query", "https://dns.turtleguard.cloud/dns-query", "https://doh.openbld.net/dns-query", "https://dns.quad9.net/dns-query")
                  fun setDoHProvider(i: Int) { if (i in DOH.indices) currentProvider = i }
                  fun getCurrentDoHProviderUrl() = DOH[currentProvider]
                  fun setPlainDns(ip: String) { plainDnsIp = ip }
              }
              private var vpn: ParcelFileDescriptor? = null
              private var worker: Thread? = null
              private var wakeLock: PowerManager.WakeLock? = null
              private var wifiLock: WifiManager.WifiLock? = null
              private val client = OkHttpClient.Builder().connectTimeout(5, TimeUnit.SECONDS).build()
              private val cache = object : android.util.LruCache<String, ByteArray>(1000) {}

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (worker != null) return START_STICKY
                  val ch = NotificationChannel("sb", "SmartBlock", NotificationManager.IMPORTANCE_LOW)
                  getSystemService(NotificationManager::class.java).createNotificationChannel(ch)
                  val pi = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  startForeground(1, NotificationCompat.Builder(this, "sb").setContentTitle("SmartBlock защищает").setSmallIcon(android.R.drawable.ic_lock_lock).setContentIntent(pi).build())
                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "SB::WL"); wakeLock?.acquire()
                  val wm = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                  wifiLock = wm.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, "SB::WFL"); wifiLock?.acquire()
                  val builder = Builder().setSession("SmartBlock").addAddress("10.0.0.2", 32).addDnsServer("10.0.0.1").addRoute("10.0.0.1", 32).setBlocking(true)
                  val excluded = getSharedPreferences("smartblock", MODE_PRIVATE).getStringSet("excluded_apps", emptySet()) ?: emptySet()
                  excluded.forEach { pkg -> try { builder.addDisallowedApplication(pkg) } catch (e: PackageManager.NameNotFoundException) {} }
                  val pfd = builder.establish()
                  if (pfd == null) { isRunning = false; return START_NOT_STICKY }
                  vpn = pfd
                  isRunning = true
                  worker = Thread { runVpn() }.also { it.start() }
                  return START_STICKY
              }

              private fun runVpn() {
                  val pfd = vpn ?: return
                  FileInputStream(pfd.fileDescriptor).use { input ->
                      FileOutputStream(pfd.fileDescriptor).use { output ->
                          val buf = ByteArray(32767); val sock = DatagramSocket().also { protect(it); it.soTimeout = 3000 }
                          while (isRunning) {
                              val n = try { input.read(buf) } catch (e: Exception) { break }
                              if (n > 0) try { handle(buf.copyOf(n), output, sock) } catch (e: Exception) {}
                          }
                      }
                  }
              }

              private fun handle(pkt: ByteArray, out: FileOutputStream, sock: DatagramSocket) {
                  if (pkt.size < 28 || ((pkt[0].toInt() ushr 4) and 0xF) != 4) return
                  if ((pkt[9].toInt() and 0xFF) != 17) return
                  val ihl = (pkt[0].toInt() and 0xF) * 4
                  val total = ((pkt[2].toInt() and 0xFF) shl 8) or (pkt[3].toInt() and 0xFF)
                  if (ihl + 8 > total || ihl + 8 > pkt.size) return
                  val srcIp = pkt.copyOfRange(12, 16); val dstIp = pkt.copyOfRange(16, 20)
                  val srcPort = ((pkt[ihl].toInt() and 0xFF) shl 8) or (pkt[ihl + 1].toInt() and 0xFF)
                  val dstPort = ((pkt[ihl + 2].toInt() and 0xFF) shl 8) or (pkt[ihl + 3].toInt() and 0xFF)
                  if (dstPort != 53) return
                  val udpLen = ((pkt[ihl + 4].toInt() and 0xFF) shl 8) or (pkt[ihl + 5].toInt() and 0xFF)
                  val dns = pkt.copyOfRange(ihl + 8, ihl + udpLen)
                  totalCount.incrementAndGet()
                  processDns(dns, out, sock, dstIp, srcIp, srcPort)
              }

              private fun processDns(dns: ByteArray, out: FileOutputStream, sock: DatagramSocket, dstIp: ByteArray, srcIp: ByteArray, srcPort: Int) {
                  val domain = DnsPacket.parseDomain(dns) ?: return
                  val blocked = FilterEngine.isBlocked(domain)
                  if (blocked) {
                      blockedCount.incrementAndGet(); BlockLog.add(domain)
                      out.write(buildIpUdp(dstIp, srcIp, 53, srcPort, DnsPacket.buildNxdomain(dns))); return
                  }
                  val cached = cache.get(domain)
                  if (cached != null) { out.write(buildIpUdp(dstIp, srcIp, 53, srcPort, cached)); return }
                  if (useDoH) sendDoH(dns, out, dstIp, srcIp, srcPort, domain) else sendUDP(dns, out, sock, dstIp, srcIp, srcPort, domain)
              }

              private fun sendUDP(dns: ByteArray, out: FileOutputStream, sock: DatagramSocket, dstIp: ByteArray, srcIp: ByteArray, srcPort: Int, key: String) {
                  try {
                      sock.send(DatagramPacket(dns, dns.size, InetAddress.getByName(plainDnsIp), 53))
                      val rb = ByteArray(4096); val rp = DatagramPacket(rb, rb.size); sock.receive(rp)
                      val resp = rb.copyOf(rp.length); cache.put(key, resp)
                      out.write(buildIpUdp(dstIp, srcIp, 53, srcPort, resp))
                  } catch (e: Exception) {}
              }

              private fun sendDoH(dns: ByteArray, out: FileOutputStream, dstIp: ByteArray, srcIp: ByteArray, srcPort: Int, key: String) {
                  try {
                      val req = Request.Builder().url(DOH[currentProvider]).post(dns.toRequestBody("application/dns-message".toMediaType())).header("Accept", "application/dns-message").build()
                      client.newCall(req).execute().use { resp ->
                          if (resp.isSuccessful && resp.body != null) {
                              val b = resp.body!!.bytes(); cache.put(key, b)
                              out.write(buildIpUdp(dstIp, srcIp, 53, srcPort, b))
                          }
                      }
                  } catch (e: Exception) { val s = DatagramSocket(); protect(s); sendUDP(dns, out, s, dstIp, srcIp, srcPort, key); s.close() }
              }

              private fun buildIpUdp(src: ByteArray, dst: ByteArray, sp: Int, dp: Int, payload: ByteArray): ByteArray {
                  val len = 8 + payload.size; val p = ByteArray(20 + len)
                  p[0] = 0x45; p[2] = ((p.size shr 8) and 0xFF).toByte(); p[3] = (p.size and 0xFF).toByte(); p[6] = 0x40; p[8] = 64; p[9] = 17
                  System.arraycopy(src, 0, p, 12, 4); System.arraycopy(dst, 0, p, 16, 4)
                  val sum = DnsPacket.checksum(p, 0, 20)
                  p[10] = ((sum shr 8) and 0xFF).toByte(); p[11] = (sum and 0xFF).toByte()
                  p[20] = ((sp shr 8) and 0xFF).toByte(); p[21] = (sp and 0xFF).toByte(); p[22] = ((dp shr 8) and 0xFF).toByte(); p[23] = (dp and 0xFF).toByte()
                  p[24] = ((len shr 8) and 0xFF).toByte(); p[25] = (len and 0xFF).toByte()
                  System.arraycopy(payload, 0, p, 28, payload.size); return p
              }

              override fun onRevoke() { isRunning = false; stopSelf() }
              override fun onDestroy() { isRunning = false; worker?.interrupt(); try { vpn?.close() } catch (e: Exception) {}; wakeLock?.let { if (it.isHeld) it.release() }; wifiLock?.let { if (it.isHeld) it.release() }; super.onDestroy() }
          }
          EOF

          cat > app/src/main/java/com/gvineon550/smartblock/FilterEngine.kt << 'EOF'
          package com.gvineon550.smartblock

          import android.content.Context
          import java.util.concurrent.ConcurrentHashMap

          object FilterEngine {
              private val exact = ConcurrentHashMap.newKeySet<String>()
              private val whitelist = ConcurrentHashMap.newKeySet<String>()
              private val cnameTrackers = setOf("doubleclick.net", "google-analytics.com", "quantserve.com", "scorecardresearch.com", "adnxs.com")

              fun normalizeDomain(input: String): String {
                  var d = input.trim().lowercase().removePrefix("https://").removePrefix("http://")
                  return d.substringBefore('/').substringBefore(':').substringBefore('?').trimEnd('.')
              }

              fun loadDefaults(ctx: Context) {
                  if (exact.isNotEmpty()) return
                  listOf("doubleclick.net", "googlesyndication.com", "google-analytics.com", "applovin.com", "unityads.unity3d.com").forEach { exact.add(it) }
                  val prefs = ctx.getSharedPreferences("smartblock", Context.MODE_PRIVATE)
                  prefs.getStringSet("user_block", emptySet())?.forEach { exact.add(normalizeDomain(it)) }
                  prefs.getStringSet("user_white", emptySet())?.forEach { whitelist.add(normalizeDomain(it)) }
                  HostsUpdater.loadCached(ctx)
              }

              fun isBlocked(domain: String): Boolean {
                  val d = normalizeDomain(domain)
                  if (whitelist.contains(d)) return false
                  if (exact.contains(d)) return true
                  var i = d.indexOf('.')
                  while (i > 0) {
                      val suffix = d.substring(i + 1)
                      if (whitelist.contains(suffix)) return false
                      if (exact.contains(suffix)) return true
                      i = d.indexOf('.', i + 1)
                  }
                  return false
              }

              fun addBlocked(domain: String, ctx: Context) {
                  val d = normalizeDomain(domain); if (d.isEmpty()) return
                  exact.add(d)
                  val p = ctx.getSharedPreferences("smartblock", Context.MODE_PRIVATE)
                  val cur = p.getStringSet("user_block", emptySet())?.toMutableSet() ?: mutableSetOf()
                  cur.add(d); p.edit().putStringSet("user_block", cur).apply()
              }
              fun addWhitelist(domain: String, ctx: Context) {
                  val d = normalizeDomain(domain); if (d.isEmpty()) return
                  whitelist.add(d)
                  val p = ctx.getSharedPreferences("smartblock", Context.MODE_PRIVATE)
                  val cur = p.getStringSet("user_white", emptySet())?.toMutableSet() ?: mutableSetOf()
                  cur.add(d); p.edit().putStringSet("user_white", cur).apply()
              }
              fun removeBlocked(domain: String) { exact.remove(normalizeDomain(domain)) }
              fun removeWhitelist(domain: String) { whitelist.remove(normalizeDomain(domain)) }
              fun addAll(domains: Collection<String>) { domains.forEach { if (it.isNotBlank()) exact.add(it) } }
              fun getDomainCount() = exact.size
              fun getWhitelistSample(): String? = whitelist.firstOrNull()
          }
          EOF

          cat > app/src/main/java/com/gvineon550/smartblock/HostsUpdater.kt << 'EOF'
          package com.gvineon550.smartblock

          import android.content.Context
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL

          object HostsUpdater {
              private const val FILE = "cached_hosts.txt"
              fun update(ctx: Context): Int {
                  val all = mutableSetOf<String>()
                  HostsSources.getActive(ctx).forEach { url ->
                      try {
                          val conn = URL(url).openConnection() as HttpURLConnection
                          conn.connectTimeout = 15000; conn.requestMethod = "GET"; conn.setRequestProperty("User-Agent", "SB/5.1")
                          conn.inputStream.bufferedReader().useLines { lines ->
                              lines.forEach { l ->
                                  val p = l.trim().substringBefore('#').trim().split(Regex("\\s+"))
                                  if (p.size >= 2 && !p[1].startsWith("127.") && !p[1].startsWith("0.0.0.0")) {
                                      val d = FilterEngine.normalizeDomain(p[1]); if (d.isNotEmpty()) all.add(d)
                                  }
                              }
                          }
                      } catch (_: Exception) { }
                  }
                  if (all.isNotEmpty()) { FilterEngine.addAll(all); File(ctx.filesDir, FILE).bufferedWriter().use { o -> all.forEach { o.write("$it\n") } } }
                  return all.size
              }
              fun loadCached(ctx: Context) {
                  val f = File(ctx.filesDir, FILE); if (!f.exists()) return
                  val list = mutableListOf<String>(); f.bufferedReader().useLines { it.forEach { l -> if (l.isNotBlank()) list.add(l) } }
                  FilterEngine.addAll(list)
              }
          }
          EOF

          cat > app/src/main/java/com/gvineon550/smartblock/DnsPacket.kt << 'EOF'
          package com.gvineon550.smartblock

          object DnsPacket {
              fun parseDomain(p: ByteArray): String? {
                  if (p.size < 12) return null
                  var pos = 12; val labels = mutableListOf<String>()
                  while (pos < p.size) {
                      val len = p[pos].toInt() and 0xFF; if (len == 0) break
                      if (len > 63 || pos + 1 + len > p.size) return null
                      labels.add(String(p, pos + 1, len, Charsets.US_ASCII)); pos += 1 + len
                  }
                  return if (labels.isEmpty()) null else labels.joinToString(".").lowercase()
              }
              fun buildNxdomain(q: ByteArray): ByteArray {
                  val r = q.copyOf(); if (r.size < 12) return r
                  r[2] = (r[2].toInt() or 0x80).toByte(); r[3] = ((r[3].toInt() and 0xF0) or 0x03).toByte()
                  for (i in 6..11) r[i] = 0; return r
              }
              fun checksum(d: ByteArray, off: Int, len: Int): Int {
                  var s = 0; var i = off
                  while (i < off + len - 1) { s += ((d[i].toInt() and 0xFF) shl 8) or (d[i + 1].toInt() and 0xFF); i += 2 }
                  if (i < off + len) s += (d[i].toInt() and 0xFF) shl 8
                  while ((s shr 16) != 0) s = (s and 0xFFFF) + (s shr 16)
                  return s.inv() and 0xFFFF
              }
          }
          EOF

