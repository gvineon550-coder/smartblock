          cat > app/src/main/java/com/gvineon550/smartblock/HostsUpdater.kt << 'EOF'
          package com.gvineon550.smartblock

          import android.content.Context
          import java.net.HttpURLConnection
          import java.net.URL

          object HostsUpdater {
              private const val PREFS = "smartblock_hosts"
              private const val KEY_CACHE = "cached_domains"
              private val SOURCES = listOf(
                  "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts",
                  "https://raw.githubusercontent.com/AdAway/adaway.github.io/master/hosts.txt"
              )

              fun update(ctx: Context): Int {
                  val all = mutableSetOf<String>()
                  SOURCES.forEach { url ->
                      try {
                          val conn = URL(url).openConnection() as HttpURLConnection
                          conn.connectTimeout = 15000; conn.requestMethod = "GET"
                          conn.inputStream.bufferedReader().useLines { lines ->
                              lines.forEach { l ->
                                  val parts = l.trim().substringBefore('#').trim().split(Regex("\\s+"))
                                  if (parts.size >= 2 && !parts[1].startsWith("127.")) all.add(parts[1].lowercase().trimEnd('.'))
                              }
                          }
                      } catch (_: Exception) { }
                  }
                  if (all.isNotEmpty()) { FilterEngine.addAll(all); saveCache(ctx, all) }
                  return all.size
              }

              fun loadCached(ctx: Context) {
                  val raw = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString(KEY_CACHE, null) ?: return
                  FilterEngine.addAll(raw.split('\n').filter { it.isNotBlank() })
              }

              private fun saveCache(ctx: Context, domains: Set<String>) {
                  ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putString(KEY_CACHE, domains.joinToString("\n")).apply()
              }
          }
