              override fun onCreateView(inflater: LayoutInflater, container: ViewGroup?, savedInstanceState: Bundle?): View {
                  return inflater.inflate(R.layout.fragment_lists, container, false)
              }
              override fun onViewCreated(view: View, savedInstanceState: Bundle?) {
                  val input = view.findViewById<EditText>(R.id.domainInput)
                  val bulk = view.findViewById<EditText>(R.id.bulkInput)
                  val bCont = view.findViewById<LinearLayout>(R.id.blockListContainer)
                  val wCont = view.findViewById<LinearLayout>(R.id.whiteListContainer)
                  fun parse(text: String): Int {
                      var c = 0
                      text.lines().forEach { l ->
                          val cl = l.substringBefore('#').trim()
                          if (cl.isNotEmpty()) {
                              val p = cl.split(Regex("\\s+")); val d = FilterEngine.normalizeDomain(if (p.size >= 2) p[1] else p[0])
                              if (d.isNotEmpty() && d.contains(".")) { FilterEngine.addBlocked(d, requireContext()); c++ }
                          }
                      }
                      return c
                  }
                  fun refresh() {
                      val p = requireContext().getSharedPreferences("smartblock", Context.MODE_PRIVATE)
                      render(bCont, p.getStringSet("user_block", emptySet()) ?: emptySet(), false, ::refresh)
                      render(wCont, p.getStringSet("user_white", emptySet()) ?: emptySet(), true, ::refresh)
                  }
                  refresh()
                  val picker = registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri: Uri? ->
                      if (uri != null) {
                          try {
                              val t = requireContext().contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() }
                              if (t != null) { val c = parse(t); refresh(); Toast.makeText(context, "Импортировано: $c", Toast.LENGTH_SHORT).show() }
                          } catch (e: Exception) { Toast.makeText(context, "Ошибка", Toast.LENGTH_SHORT).show() }
                      }
                  }
                  view.findViewById<Button>(R.id.fileBtn).setOnClickListener { picker.launch(arrayOf("text/plain", "*/*")) }
                  view.findViewById<Button>(R.id.addBlockBtn).setOnClickListener {
                      val d = FilterEngine.normalizeDomain(input.text.toString())
                      if (d.isNotEmpty()) { FilterEngine.addBlocked(d, requireContext()); input.text.clear(); refresh() }
                  }
                  view.findViewById<Button>(R.id.addWhiteBtn).setOnClickListener {
                      val d = FilterEngine.normalizeDomain(input.text.toString())
                      if (d.isNotEmpty()) { FilterEngine.addWhitelist(d, requireContext()); input.text.clear(); refresh() }
                  }
                  view.findViewById<Button>(R.id.importBtn).setOnClickListener {
                      val c = parse(bulk.text.toString()); bulk.text.clear(); refresh(); Toast.makeText(context, "Импортировано: $c", Toast.LENGTH_SHORT).show()
                  }
              }
              private fun render(cont: LinearLayout, set: Set<String>, isW: Boolean, refresh: () -> Unit) {
                  cont.removeAllViews()
                  if (set.isEmpty()) { cont.addView(TextView(requireContext()).apply { text = "Пусто"; setTextColor(Color.GRAY) }); return }
                  set.sorted().forEach { d ->
                      val row = LinearLayout(requireContext()).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
                      row.addView(TextView(requireContext()).apply { text = d; setTextColor(Color.WHITE); layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f) })
                      row.addView(Button(requireContext()).apply {
                          text = "✕"; setTextColor(Color.RED); setBackgroundColor(Color.TRANSPARENT)
                          setOnClickListener {
                              val p = requireContext().getSharedPreferences("smartblock", Context.MODE_PRIVATE)
                              val k = if (isW) "user_white" else "user_block"
                              val c = p.getStringSet(k, emptySet())?.toMutableSet() ?: mutableSetOf()
                              c.remove(d); p.edit().putStringSet(k, c).apply()
                              if (isW) FilterEngine.removeWhitelist(d) else FilterEngine.removeBlocked(d)
                              refresh()
                          }
                      })
                      cont.addView(row)
                  }
              }
          }
