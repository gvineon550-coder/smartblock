          cat > app/src/main/java/com/gvineon550/smartblock/App.kt << 'EOF'
          package com.gvineon550.smartblock

          import android.app.Application
          import android.content.Context
          import androidx.appcompat.app.AppCompatDelegate
          import androidx.work.*
          import java.io.PrintWriter
          import java.io.StringWriter
          import java.util.concurrent.TimeUnit

          class App : Application() {
              override fun onCreate() {
                  super.onCreate()
                  val defaultHandler = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { thread, throwable ->
                      val sw = StringWriter(); throwable.printStackTrace(PrintWriter(sw))
                      getSharedPreferences("crash", Context.MODE_PRIVATE).edit().putString("log", sw.toString()).apply()
                      defaultHandler?.uncaughtException(thread, throwable)
                  }
                  val themePref = getSharedPreferences("smartblock", MODE_PRIVATE).getInt("theme", AppCompatDelegate.MODE_NIGHT_FOLLOW_SYSTEM)
                  AppCompatDelegate.setDefaultNightMode(themePref)
                  setupWorkers()
              }
              private fun setupWorkers() {
                  val c = Constraints.Builder().setRequiredNetworkType(NetworkType.CONNECTED).build()
                  WorkManager.getInstance(this).enqueueUniquePeriodicWork("Watchdog", ExistingPeriodicWorkPolicy.KEEP, PeriodicWorkRequestBuilder<WatchdogWorker>(15, TimeUnit.MINUTES).build())
                  WorkManager.getInstance(this).enqueueUniquePeriodicWork("UpdateLists", ExistingPeriodicWorkPolicy.KEEP, PeriodicWorkRequestBuilder<UpdateWorker>(24, TimeUnit.HOURS).setConstraints(c).build())
              }
          }
          EOF

          cat > app/src/main/java/com/gvineon550/smartblock/Workers.kt << 'EOF'
          package com.gvineon550.smartblock

          import android.content.Context
          import android.content.Intent
          import androidx.core.content.ContextCompat
          import androidx.work.Worker
          import androidx.work.WorkerParameters

          class WatchdogWorker(ctx: Context, params: WorkerParameters) : Worker(ctx, params) {
              override fun doWork(): Result {
                  val prefs = applicationContext.getSharedPreferences("smartblock", Context.MODE_PRIVATE)
                  if (prefs.getBoolean("vpn_was_on", false) && !DnsVpnService.isRunning) {
                      ContextCompat.startForegroundService(applicationContext, Intent(applicationContext, DnsVpnService::class.java))
                  }
                  return Result.success()
              }
          }
          class UpdateWorker(ctx: Context, params: WorkerParameters) : Worker(ctx, params) {
              override fun doWork(): Result { try { HostsUpdater.update(applicationContext) } catch (e: Exception) {}; return Result.success() }
          }
          EOF

          cat > app/src/main/java/com/gvineon550/smartblock/VpnTileService.kt << 'EOF'
          package com.gvineon550.smartblock

          import android.app.PendingIntent
          import android.content.Intent
          import android.net.VpnService
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService
          import androidx.core.content.ContextCompat

          class VpnTileService : TileService() {
              override fun onClick() {
                  super.onClick()
                  if (DnsVpnService.isRunning) {
                      stopService(Intent(this, DnsVpnService::class.java))
                  } else {
                      val intent = VpnService.prepare(this)
                      if (intent != null) {
                          startActivityAndCollapse(PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK), PendingIntent.FLAG_IMMUTABLE))
                      } else {
                          ContextCompat.startForegroundService(this, Intent(this, DnsVpnService::class.java))
                      }
                  }
                  updateTile()
              }
              override fun onStartListening() { super.onStartListening(); updateTile() }
              private fun updateTile() {
                  qsTile?.state = if (DnsVpnService.isRunning) Tile.STATE_ACTIVE else Tile.STATE_INACTIVE
                  qsTile?.updateTile()
              }
          }
          EOF

          cat > app/src/main/java/com/gvineon550/smartblock/AppsFragment.kt << 'EOF'
          package com.gvineon550.smartblock

          import android.content.Context
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.CheckBox
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import androidx.fragment.app.Fragment

          class AppsFragment : Fragment() {
              override fun onCreateView(inflater: LayoutInflater, container: ViewGroup?, savedInstanceState: Bundle?): View {
                  val scroll = ScrollView(requireContext())
                  val layout = LinearLayout(requireContext()).apply { orientation = LinearLayout.VERTICAL; setPadding(32, 32, 32, 32) }
                  scroll.addView(layout)
                  val pm = requireContext().packageManager
                  val packages = pm.getInstalledApplications(PackageManager.GET_META_DATA)
                  val prefs = requireContext().getSharedPreferences("smartblock", Context.MODE_PRIVATE)
                  val excluded = prefs.getStringSet("excluded_apps", emptySet())?.toMutableSet() ?: mutableSetOf()
                  packages.sortedBy { pm.getApplicationLabel(it).toString() }.forEach { app ->
                      if (app.packageName != requireContext().packageName) {
                          val cb = CheckBox(requireContext()).apply {
                              text = pm.getApplicationLabel(app).toString()
                              isChecked = excluded.contains(app.packageName)
                              setOnCheckedChangeListener { _, isChecked ->
                                  if (isChecked) excluded.add(app.packageName) else excluded.remove(app.packageName)
                                  prefs.edit().putStringSet("excluded_apps", excluded).apply()
                              }
                          }
                          layout.addView(cb)
                      }
                  }
                  return scroll
              }
          }
          EOF

