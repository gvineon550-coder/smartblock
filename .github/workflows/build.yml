          cat > app/src/main/java/com/gvineon550/smartblock/DnsPacket.kt << 'EOF'
          package com.gvineon550.smartblock

          object DnsPacket {
              fun parseDomain(packet: ByteArray): String? {
                  if (packet.size < 12) return null
                  var pos = 12; val labels = mutableListOf<String>()
                  while (pos < packet.size) {
                      val len = packet[pos].toInt() and 0xFF
                      if (len == 0) break
                      if (len > 63 || pos + 1 + len > packet.size) return null
                      labels.add(String(packet, pos + 1, len, Charsets.US_ASCII)); pos += 1 + len
                  }
                  return if (labels.isEmpty()) null else labels.joinToString(".").lowercase()
              }
              fun buildNxdomain(query: ByteArray): ByteArray {
                  val r = query.copyOf(); if (r.size < 12) return r
                  r[2] = (r[2].toInt() or 0x80).toByte(); r[3] = ((r[3].toInt() and 0xF0) or 0x03).toByte()
                  for (i in 6..11) r[i] = 0; return r
              }
              fun checksum(d: ByteArray, off: Int, len: Int): Int {
                  var sum = 0; var i = off
                  while (i < off + len - 1) { sum += ((d[i].toInt() and 0xFF) shl 8) or (d[i + 1].toInt() and 0xFF); i += 2 }
                  if (i < off + len) sum += (d[i].toInt() and 0xFF) shl 8
                  while ((sum shr 16) != 0) sum = (sum and 0xFFFF) + (sum shr 16)
                  return sum.inv() and 0xFFFF
              }
          }
