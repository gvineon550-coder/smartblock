name: Build SmartBlock
on:
  push: { branches: [main] }
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: Restore keystore from cache
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: keystore.jks
          key: smartblock-keystore-v1

      - name: Generate keystore if missing
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore keystore.jks \
            -alias smartblock \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass smartblockpass -keypass smartblockpass \
            -dname "CN=SmartBlock, OU=Dev, O=Personal, L=City, S=State, C=RU"

      - name: Generate project files
        run: |
          mkdir -p app/src/main/java/com/gvineon550/smartblock
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "SmartBlock"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.gvineon550.smartblock"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.gvineon550.smartblock"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 5
                  versionName = "3.0"
              }
              signingConfigs {
                  create("release") {
                      storeFile = rootProject.file("keystore.jks")
                      storePassword = "smartblockpass"
                      keyAlias = "smartblock"
                      keyPassword = "smartblockpass"
                  }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("androidx.work:work-runtime-ktx:2.9.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
