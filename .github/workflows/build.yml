      - name: Set version from run number
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.0.${VERSION_CODE}"
          sed -i "s/versionCode = 2/versionCode = ${VERSION_CODE}/" app/build.gradle.kts
          sed -i "s/versionName = \"1.1\"/versionName = \"${VERSION_NAME}\"/" app/build.gradle.kts
          echo "Building SmartDNS v${VERSION_NAME} (${VERSION_CODE})"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          VERSION="1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "SmartDNS-v${VERSION}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SmartDNS v1.0.${{ github.run_number }}
          body: |
            Автоматический релиз SmartDNS.

            **Версия:** 1.0.${{ github.run_number }}
            **Commit:** ${{ github.sha }}
            **Сборка:** [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            **Что делает:**
            - Блокирует рекламу и трекеры на уровне DNS через VpnService
