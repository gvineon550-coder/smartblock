          package com.gvineon550.smartblock

          import java.text.SimpleDateFormat
          import java.util.*

          object BlockLog {
              private val logs = LinkedList<String>()
              private val format = SimpleDateFormat("HH:mm:ss", Locale.getDefault())
              fun add(domain: String) {
                  synchronized(logs) {
                      logs.addFirst("${format.format(Date())} - $domain")
                      if (logs.size > 100) logs.removeLast()
                  }
              }
              fun getLog(): String { synchronized(logs) { return if (logs.isEmpty()) "Лог пуст." else logs.joinToString("\n") } }
              fun filter(query: String): String {
                  synchronized(logs) {
                      return logs.filter { it.contains(query.lowercase()) }.joinToString("\n").ifEmpty { "Ничего не найдено" }
                  }
              }
          }
